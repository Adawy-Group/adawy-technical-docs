        - paragraph [ref=e308]:
          - text: A new product is one entry in the content file plus one block in
          - strong [ref=e309]: each
          - text: message file. A test asserts the locale files share an identical key tree, and it fails the build.
        - paragraph [ref=e310]:
          - strong [ref=e311]: Why, concretely.
          - text: The alternative — one file per locale carrying both the structure and the strings — duplicates the catalogue’s shape as many times as there are locales, and the copies drift. Worse, a missing Arabic key is
          - strong [ref=e312]: not
          - text: a compile error and
          - strong [ref=e313]: not
          - text: "visible in development: it is a runtime hole that appears for Arabic visitors only, which is the audience least likely to report it ("
          - link "i18n & RTL" [ref=e314] [cursor=pointer]:
            - /url: /standards/i18n-rtl#the-parity-test-is-a-merge-gate
          - text: ).
        - paragraph [ref=e315]:
          - strong [ref=e316]: The exception worth knowing.
          - text: Facts that are set in Latin in both locales — a phone number, an address, a country code — live in the
          - strong [ref=e317]: content
          - text: tree even though they are human-readable, because translating them would be wrong.
          - code [ref=e318]: adawy-group-links
          - text: documents exactly this call in its own source.
        - paragraph [ref=e319]:
          - strong [ref=e320]: When it does not apply.
          - text: Never, in a bilingual product. This is the one pattern with no defensible exception in this org — retrofitting it is the most expensive mistake available on a client project.
        - heading [level=2] [ref=e321]:
