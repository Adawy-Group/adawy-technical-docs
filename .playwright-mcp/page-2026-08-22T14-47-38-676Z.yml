        - paragraph [ref=e285]:
          - strong [ref=e286]: Why, concretely.
          - text: Swapping a provider becomes one function body instead of a search across the codebase — but that is the small win. The large one is that a seam is the only place a
          - strong [ref=e287]: half-wired
          - text: "integration can be caught. A mail transport configured in one of four call sites fails silently in production: the form submits, the user sees a success state, and the enquiry goes nowhere for weeks because nothing errors ("
          - link "forms & enquiries" [ref=e288] [cursor=pointer]:
            - /url: /guides/forms-and-enquiries
          - text: ).
