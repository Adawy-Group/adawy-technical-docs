        - paragraph [ref=e478]:
          - strong [ref=e479]: Why, concretely.
          - text: "The department’s own history is the argument: the accessibility findings on the old site were all things a checklist was supposed to catch, which is why accessibility is now an axe-core merge gate rather than a review opinion ("
          - link "testing" [ref=e480] [cursor=pointer]:
            - /url: /standards/testing
          - text: ).
          - emphasis [ref=e481]: A rule that only exists in a document gets skipped on the busy week.
        - paragraph [ref=e482]:
          - strong [ref=e483]: The decision rule.
          - text: "Ask:"
          - strong [ref=e484]: would this mistake look like a mistake?
          - text: If a reviewer scanning the diff would see it, prose is enough. If it renders identically whether it is right or wrong — a
          - code [ref=e485]: "tel:"
          - text: href, an Arabic letter, a keyframe count, a second copy of a constant — it belongs in a test.
        - paragraph [ref=e486]:
          - strong [ref=e487]: When it does not apply.
          - text: "Judgement. Naming, structure, whether a section earns its place: no rule catches those, and pretending otherwise produces lint rules people disable."
        - heading [level=2] [ref=e488]:
          - text: 7. Generated output is committed, and never hand-edited
          - link "Permalink for this section" [ref=e489] [cursor=pointer]:
            - /url: "#7-generated-output-is-committed-and-never-hand-edited"
            - text: "#"
        - paragraph [ref=e490]:
          - strong [ref=e491]: The shape.
          - text: Optimised images, logo components, font subsets, baked pattern tiles, encoded video and OG assets are produced by
          - strong [ref=e492]: hand-run scripts
          - text: whose source artwork usually lives outside the repository — and their
          - strong [ref=e493]: output is committed
          - text: .
        - paragraph [ref=e494]:
          - strong [ref=e495]: Why, concretely.
          - text: "CI cannot reproduce them (it does not have the masters), so a clean clone must build without them. Committing the output is what makes that true. The cost is a rule that has to be stated because nothing enforces it:"
          - strong [ref=e496]: do not delete a baked file expecting to rebake it
          - text: ", and do not hand-edit a generated one — regenerate it."
        - paragraph [ref=e497]:
          - strong [ref=e498]: Where it bites.
          - code [ref=e499]: adawy-group-links
          - text: bakes its background pattern to a PNG because a viewport-sized SVG pattern stalled headless capture — and
          - code [ref=e500]: public/
          - text: is in
          - code [ref=e501]: .prettierignore
          - text: ", so editing the geometry without re-baking changes nothing on screen"
          - strong [ref=e502]: and nothing flags it
          - text: .
        - paragraph [ref=e503]:
          - strong [ref=e504]: When it does not apply.
          - text: Anything the build can produce from tracked sources. Then it belongs in
          - code [ref=e505]: .gitignore
          - text: ", and committing it is noise in every future diff."
