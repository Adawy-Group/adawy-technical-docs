        - paragraph [ref=e365]:
          - strong [ref=e366]: Why, concretely.
          - text: "A string shared across two files is a rename waiting to half-happen, and the half that fails is silent by construction: a selector that matches nothing does not throw, it just animates nothing. The type system is the only reviewer that reads every call site every time."
        - paragraph [ref=e367]:
