        - paragraph [ref=e237]:
          - text: Eight repositories, two worlds, no shared code between them (
          - link "ADR-010" [ref=e238] [cursor=pointer]:
            - /url: /architecture/adrs
          - text: ) — and yet the same seven shapes keep appearing. They are not house style. Each one is the scar left by a specific bug, and each is written here with that bug attached, because
          - strong [ref=e239]: a pattern without its failure mode is a preference.
        - paragraph [ref=e240]: Read this before your second week. It is the fastest way to make an unfamiliar repo in this org feel familiar.
        - paragraph [ref=e246]: Every pattern below is in production somewhere you can go and read. Where a repo does something different, that is noted too — the exceptions are as instructive as the rule.
        - heading [level=2] [ref=e247]:
          - text: 1. The seam
          - link "Permalink for this section" [ref=e248] [cursor=pointer]:
            - /url: "#1-the-seam"
            - text: "#"
        - paragraph [ref=e249]:
          - strong [ref=e250]: The shape.
          - text: Everything that leaves the application — an email, a plugin registration, a public origin — goes through
          - strong [ref=e251]: exactly one module
          - text: . Callers know the module; they know nothing about the transport.
        - paragraph [ref=e252]:
          - strong [ref=e253]: "Where it already is:"
        - table [ref=e254]:
