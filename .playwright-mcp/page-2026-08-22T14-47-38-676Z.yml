        - heading [level=2] [ref=e369]:
          - text: 4. Read once, hand the same object to everyone
          - link "Permalink for this section" [ref=e370] [cursor=pointer]:
            - /url: "#4-read-once-hand-the-same-object-to-everyone"
            - text: "#"
        - paragraph [ref=e371]:
          - strong [ref=e372]: The shape.
          - text: Each frame, one place reads
          - strong [ref=e373]: every
          - text: input channel into a single immutable frame object and passes that same object to every consumer. Consumers never read a channel themselves.
        - paragraph [ref=e374]:
          - strong [ref=e375]: Where it is.
          - code [ref=e376]: apps/group
          - text: "’s stage: drivers publish normalized scroll progress to module-singleton channels, the render loop samples all of them once, and every pass receives the same"
          - code [ref=e377]: StageFrame
          - text: (
          - link "platform architecture" [ref=e378] [cursor=pointer]:
            - /url: /architecture/platform-architecture
          - text: ).
        - paragraph [ref=e379]:
          - strong [ref=e380]: Why, concretely.
          - text: Two consumers reading the same channel at different moments in one frame see different values, and the picture
          - strong [ref=e381]: tears
          - text: — one element has moved and its neighbour has not. It is also what lets a consumer be unit-tested with a plain object instead of a live scroll bus, which is why the choreography maths in both
          - code [ref=e382]: apps/group
          - text: and
          - code [ref=e383]: jumeira
          - text: is testable in Node with no DOM at all (
          - link "testing" [ref=e384] [cursor=pointer]:
            - /url: /standards/testing
          - text: ).
        - paragraph [ref=e385]:
          - strong [ref=e386]: The generalization.
          - emphasis [ref=e387]: Read your inputs once at the boundary, then pass values.
          - text: The same instinct is why a quote total is re-derived server-side from line identities rather than trusted from the client (
          - link "forms & enquiries" [ref=e388] [cursor=pointer]:
            - /url: /guides/forms-and-enquiries
          - text: ).
        - paragraph [ref=e389]:
          - strong [ref=e390]: When it does not apply.
          - text: Anything not on a per-frame or per-request hot path. This is a consistency pattern, not a performance one.
        - heading [level=2] [ref=e391]:
          - text: 5. One governor for one question
          - link "Permalink for this section" [ref=e392] [cursor=pointer]:
            - /url: "#5-one-governor-for-one-question"
            - text: "#"
        - paragraph [ref=e393]:
          - strong [ref=e394]: The shape.
          - text: A question that every effect on a page would otherwise answer for itself —
          - emphasis [ref=e395]: is this device struggling?
          - text: — is answered
          - strong [ref=e396]: once
          - text: ", in one module, and read by everything."
        - paragraph [ref=e397]:
          - code [ref=e398]: apps/group
          - text: ’s performance tier has two states,
          - code [ref=e399]: full
          - text: and
          - code [ref=e400]: lite
          - text: . It is
          - strong [ref=e401]: downgrade-only
          - text: and
          - strong [ref=e402]: session-sticky
          - text: ", and lite sheds pixels — blur, backdrop-filters, an ambient-occlusion pass, some device pixel ratio — never choreography."
        - paragraph [ref=e403]:
          - strong [ref=e404]: Why, concretely.
          - text: "Three effects each inventing their own “is this a slow device” heuristic will disagree, and a page that flips between quality levels mid-visit is more visible than either steady state. Centralising it also makes the invariants statable:"
          - emphasis [ref=e405]: no fps cap ever
          - text: (a 3D layer at a capped frame rate judders against native-refresh DOM, which reads as broken in a way a slightly softer image never does), and
          - emphasis [ref=e406]: read the tier, never cache it
          - text: (it resolves lazily and can change once mid-session).
        - paragraph [ref=e407]:
          - strong [ref=e408]: The generalization.
          - text: Any cross-cutting question with more than one asker — device capability, connection speed, reduced-motion, theme — belongs to one module.
          - code [ref=e409]: jumeira
          - text: "reaches the same conclusion from a different direction: its bandwidth probe is a"
          - strong [ref=e410]: measurement
          - text: ", deliberately not"
          - code [ref=e411]: navigator.connection
          - text: ", because that API does not exist in Safari and its"
          - code [ref=e412]: effectiveType
          - text: reports
          - code [ref=e413]: 4g
          - text: from about 700 kbps up.
        - paragraph [ref=e419]:
          - strong [ref=e420]:
            - code [ref=e421]: prefers-reduced-motion
            - text: is a separate axis from quality, and never a substitute for it.
          - text: Reduced motion is accessibility and removes the animation; the tier is quality and keeps it. Conflating them ships a degraded experience to someone who asked for a calm one.
        - heading [level=2] [ref=e422]:
          - text: 6. Enforce it, do not document it
          - link "Permalink for this section" [ref=e423] [cursor=pointer]:
            - /url: "#6-enforce-it-do-not-document-it"
            - text: "#"
        - paragraph [ref=e424]:
